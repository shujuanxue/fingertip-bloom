<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0508" />
  <title>指尖生花 · Fingertip Bloom</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="scene-root"></div>

  <!-- 首页 -->
  <section id="view-home" class="view">
    <div class="home-inner">
      <p class="home-sub">FINGERTIP BLOOM</p>
      <h1 class="home-title">指尖生花</h1>
      <p class="home-tag">让每一次触碰，都成为生命的绽放。</p>
      <button id="btn-start" class="btn-primary">开始体验</button>
    </div>
    <div class="home-hint">授权摄像头后可识别手势 · 手掌张开 = 绽放 &nbsp;/&nbsp; 握拳 = 收拢</div>
  </section>

  <!-- 主交互页 -->
  <section id="view-experience" class="view hidden">
    <header class="hud-top">
      <div class="brand">FINGERTIP BLOOM · 指尖生花</div>
      <div class="status" id="status-text">初始化…</div>
    </header>

    <div id="camera-wrap" class="camera-wrap hidden">
      <video id="camera-video" playsinline muted></video>
      <canvas id="camera-overlay"></canvas>
      <div class="camera-label">
        <span id="gesture-label">—</span>
        <span id="bloom-value">0%</span>
      </div>
    </div>

    <div class="control-bar">
      <button id="btn-camera" class="ctrl" title="开启/关闭摄像头">📷 摄像头</button>
      <button id="btn-fullscreen" class="ctrl" title="全屏模式">⛶ 全屏</button>
      <label class="ctrl" title="粒子强度">
        强度 <input id="range-intensity" type="range" min="0.4" max="1.6" step="0.1" value="1" />
      </label>
      <button id="btn-reset" class="ctrl" title="重置花朵">↺ 重置</button>
      <button id="btn-mouse" class="ctrl" title="鼠标备用模式">🖱 鼠标模式</button>
      <button id="btn-audio" class="ctrl" title="声音开关">🔇 声音</button>
      <button id="btn-end" class="ctrl" title="结束体验">⏻ 结束</button>
    </div>
  </section>

  <!-- 结束展示页 -->
  <section id="view-end" class="view hidden">
    <div class="end-inner">
      <p class="end-line">原来，花开不必等待春天。</p>
      <button id="btn-screenshot" class="btn-primary">保存此刻</button>
      <button id="btn-restart" class="btn-ghost">再体验一次</button>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
